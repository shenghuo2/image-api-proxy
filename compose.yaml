services:
  proxy:
    image: ${PROXY_IMAGE:-shenghuo2/novelai-api-proxy:v0.1.5-relay-compat-2}
    build: .
    restart: unless-stopped
    stop_grace_period: 8m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PROXY_LISTEN_ADDR: 0.0.0.0:8787
      PROXY_ADMIN_KEY: ${PROXY_ADMIN_KEY:?set a random admin key in .env}
      PROXY_NAI_TOKEN: ${PROXY_NAI_TOKEN:-}
      PROXY_QUEUE_SIZE: ${PROXY_QUEUE_SIZE:-64}
      PROXY_QUOTA_TTL: ${PROXY_QUOTA_TTL:-5m}
      PROXY_ADMIN_ORIGIN: ${PROXY_ADMIN_ORIGIN:-}
      PROXY_STATE_PATH: /data/keys.json
      PROXY_BIND_ADDR: ${PROXY_BIND_ADDR:-127.0.0.1}
      PROXY_TRUSTED_PROXY_CIDRS: ${PROXY_TRUSTED_PROXY_CIDRS:-}
    volumes:
      - proxy-data:/data
    ports:
      - ${PROXY_BIND_ADDR:-127.0.0.1}:${PROXY_HOST_PORT:-8787}:8787
    healthcheck:
      test: ["CMD", "/novelai-api-proxy", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  proxy-data:
